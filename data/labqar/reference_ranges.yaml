# LabQAR reference ranges — Phase 5 (Interpretation).
#
# POC placeholder table. Replace with the 550-row LOINC-mapped LabQAR xlsx when
# it lands (the loader prefers the xlsx if present; see stages/interpret_rules.py).
# Ranges here are illustrative adult ranges for the analytes in the eval set; they
# are NOT a clinical authority. Interpretation is pure lookup + comparison — never
# a model, never a diagnosis, never an autonomous escalation.
#
# Per analyte:
#   canonical      display name
#   aliases        lowercased match keys (OCR/summary analyte names map to these)
#   unit           expected unit (mismatch -> needs_review, never a silent flag)
#   default        {low, high}  reference interval used when sex is unknown
#   by_sex         optional {male:{low,high}, female:{low,high}}
#   critical       optional {low, high} panic thresholds -> status "critical"
#   direction      optional "high_only" | "low_only" for one-sided analytes

version: poc-1
analytes:
  - canonical: Hemoglobin
    aliases: [hemoglobin, haemoglobin, hb, hgb]
    unit: g/dL
    default: {low: 12.0, high: 17.0}
    by_sex:
      male: {low: 13.0, high: 17.0}
      female: {low: 12.0, high: 15.0}
    critical: {low: 7.0, high: 20.0}

  - canonical: WBC
    aliases: [wbc, white blood cell, total leucocyte count, tlc, leukocyte count]
    unit: /cumm
    default: {low: 4000, high: 11000}
    critical: {low: 2000, high: 30000}

  - canonical: Platelets
    aliases: [platelets, platelet count, plt]
    unit: lakhs/cumm
    default: {low: 1.5, high: 4.1}
    critical: {low: 0.5, high: 10.0}

  - canonical: Glucose Fasting
    aliases: [glucose fasting, fasting glucose, fbs, glucose, blood sugar fasting]
    unit: mg/dL
    default: {low: 70, high: 100}
    critical: {low: 50, high: 400}

  - canonical: HbA1c
    aliases: [hba1c, glycated hemoglobin, glycosylated hemoglobin, a1c]
    unit: "%"
    default: {low: 4.0, high: 5.6}
    direction: high_only

  - canonical: Creatinine
    aliases: [creatinine, serum creatinine, creat]
    unit: mg/dL
    default: {low: 0.7, high: 1.3}
    critical: {high: 5.0}
    direction: high_only

  - canonical: Urea
    aliases: [urea, blood urea, bun]
    unit: mg/dL
    default: {low: 15, high: 40}
    direction: high_only

  - canonical: TSH
    aliases: [tsh, thyroid stimulating hormone]
    unit: mIU/L
    default: {low: 0.4, high: 4.0}
    critical: {low: 0.1, high: 20.0}

  - canonical: Vitamin D
    aliases: [vitamin d, 25-oh vitamin d, vit d, 25(oh)d]
    unit: ng/mL
    default: {low: 30, high: 100}
    direction: low_only

  - canonical: Total Cholesterol
    aliases: [total cholesterol, cholesterol total, cholesterol]
    unit: mg/dL
    default: {low: 125, high: 200}
    direction: high_only

  - canonical: Triglycerides
    aliases: [triglycerides, tg, trig]
    unit: mg/dL
    default: {low: 0, high: 150}
    direction: high_only

  - canonical: Bilirubin Total
    aliases: [bilirubin total, total bilirubin, t.bilirubin, bilirubin]
    unit: mg/dL
    default: {low: 0.3, high: 1.2}
    critical: {high: 15.0}
    direction: high_only

  - canonical: SGPT
    aliases: [sgpt, alt, alanine aminotransferase, sgpt/alt]
    unit: U/L
    default: {low: 0, high: 45}
    direction: high_only

  - canonical: Vitamin B12
    aliases: [vitamin b12, b12, cobalamin, vit b12]
    unit: pg/mL
    default: {low: 200, high: 900}
    direction: low_only

  - canonical: Ferritin
    aliases: [ferritin, serum ferritin]
    unit: ng/mL
    default: {low: 30, high: 400}

  # --- Coverage gap fill (2026-07-22) ---------------------------------------
  # These 7 analytes appear on routine Indian CBC / LFT / lipid / inflammatory
  # panels but are ABSENT from the published LabQAR-550 table, so every one of
  # them resolved to `unknown / no_reference_range` (bench: 56/63 panel
  # coverage). Added here as curated-poc entries rather than hand-editing the
  # generated file.
  #
  # PENDING CLINICIAN REVIEW — same status as the rest of this table. Ranges are
  # standard adult intervals and are NOT a clinical authority.
  #
  # NOTE ON THE LIPID FRACTIONS: HDL and LDL are deliberately given explicit
  # entries with opposite `direction` values. They must never be resolved by
  # similarity to "Total Cholesterol" — a fuzzy match scores LDL 190 (very high)
  # against the total-cholesterol interval and returns `normal`, silently losing
  # a critical finding. Exact aliases only; see nlpplan.md.

  - canonical: MCV
    aliases: [mcv, mean corpuscular volume, mean cell volume, m.c.v]
    unit: fL
    default: {low: 80, high: 100}

  - canonical: RDW
    aliases: [rdw, red cell distribution width, rdw-cv, rdw cv, r.d.w]
    unit: '%'
    default: {low: 11.5, high: 14.5}

  - canonical: Total Protein
    aliases: [total protein, total proteins, protein total, serum total protein,
              serum protein, t.protein]
    unit: g/dL
    default: {low: 6.0, high: 8.3}

  - canonical: Globulin
    aliases: [globulin, globulins, serum globulin]
    unit: g/dL
    default: {low: 2.0, high: 3.5}

  # Low HDL is the cardiovascular risk; a high HDL is not flagged -> low_only.
  - canonical: HDL Cholesterol
    aliases: [hdl cholesterol, hdl, hdl-c, hdl c, cholesterol hdl,
              high density lipoprotein, serum hdl]
    unit: mg/dL
    default: {low: 40, high: 60}
    by_sex:
      male: {low: 40, high: 60}
      female: {low: 50, high: 60}
    direction: low_only

  # High LDL is the risk -> high_only. 190 mg/dL is the severe-hypercholesterolemia
  # threshold that must surface rather than reading as an unremarkable value.
  - canonical: LDL Cholesterol
    aliases: [ldl cholesterol, ldl, ldl-c, ldl c, cholesterol ldl,
              low density lipoprotein, serum ldl]
    unit: mg/dL
    default: {low: 0, high: 100}
    critical: {high: 190}
    direction: high_only

  # Unit matters here: CRP is reported as mg/L on most Indian panels but some
  # print mg/dL (a 10x difference). A unit mismatch routes to needs_review
  # rather than comparing across scales — see interpret_rules._unit_mismatch.
  - canonical: C-Reactive Protein
    aliases: [c-reactive protein, c reactive protein, crp, hs-crp, hscrp,
              high sensitivity crp, serum crp]
    unit: mg/L
    default: {low: 0, high: 5}
    direction: high_only

  # --- ALIAS-ONLY additions (2026-07-22) ------------------------------------
  # These analytes ALREADY exist in the published LabQAR table with published
  # intervals; only the Indian-report naming was missing. No `default` key here
  # ON PURPOSE — merge_curated applies a curated range only when one is given,
  # so omitting it keeps the published interval and adds the aliases alone.

  - canonical: Hematocrit
    aliases: [hematocrit, haematocrit, hct, packed cell volume, pcv]

  - canonical: Red blood cell count
    aliases: [red blood cell count, rbc, rbc count, r.b.c count, r.b.c. count,
              total rbc count, erythrocyte count]

  - canonical: Glycated hemoglobin (hemoglobin A1, A1c)
    aliases: [glycated hemoglobin, hba1c, hb a1c, glycosylated hb,
              glycosylated haemoglobin, glycosylated hemoglobin]

  - canonical: Iron-binding capacity
    aliases: [iron-binding capacity, iron binding capacity, tibc,
              total iron binding capacity]

  - canonical: Rheumatoid factor
    aliases: [rheumatoid factor, ra factor, rafactor, ra test]

  # --- NEW entries absent from LabQAR-550 (2026-07-22) ----------------------
  # PENDING CLINICIAN REVIEW, as with the rest of this table.

  # Distinct from "Transferrin (siderophilin)", which is the PROTEIN
  # concentration (mg/dL). Saturation is a derived percentage with its own
  # interval — aliasing the two together would apply the wrong range.
  - canonical: Transferrin Saturation
    aliases: [transferrin saturation, transferin saturation, tsat,
              iron saturation, '% saturation']
    unit: '%'
    default: {low: 20, high: 50}

  # Bilirubin fractions are separate analytes from total bilirubin. They are
  # given explicit entries (never aliases of "Bilirubin") for the same reason
  # HDL/LDL are: the names are near-identical, the intervals are not.
  - canonical: Direct Bilirubin
    aliases: [direct bilirubin, conjugated bilirubin, d.bilirubin, bilirubin direct]
    unit: mg/dL
    default: {low: 0, high: 0.3}
    direction: high_only

  - canonical: Indirect Bilirubin
    aliases: [indirect bilirubin, unconjugated bilirubin, i.bilirubin,
              bilirubin indirect]
    unit: mg/dL
    default: {low: 0.2, high: 1.0}
    direction: high_only

  - canonical: VLDL Cholesterol
    aliases: [vldl cholesterol, vldl, vldl-c, cholesterol vldl,
              very low density lipoprotein]
    unit: mg/dL
    default: {low: 2, high: 30}
    direction: high_only

  # Ionised calcium is NOT total calcium: different specimen handling, different
  # unit (mmol/L vs mg/dL) and a different interval.
  - canonical: Ionised Calcium
    aliases: [ionised calcium, ionized calcium, ionic calcium, calcium ionised,
              free calcium]
    unit: mmol/L
    default: {low: 1.05, high: 1.35}

  - canonical: A/G Ratio
    aliases: [a/g ratio, ag ratio, albumin/globulin ratio, albumin globulin ratio]
    default: {low: 1.0, high: 2.5}

  # Random (post-meal-agnostic) glucose has a wider interval than the fasting
  # entry above; they must not collapse into one another.
  - canonical: Random Blood Sugar
    aliases: [random blood sugar, blood sugar random, rbs, glucose random,
              random glucose, blood sugar (r)]
    unit: mg/dL
    default: {low: 70, high: 140}

  - canonical: Urine Specific Gravity
    aliases: [specific gravity, sp. gravity, sp gravity]
    default: {low: 1.005, high: 1.030}
