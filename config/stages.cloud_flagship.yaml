# Flagship stage overrides for SS_ENV=cloud_flagship (deep-merged over stages.yaml).

ocr:
  # Edge trusts a PDF's embedded text layer to skip the OCR engine (fast on the
  # kiosk). But a text-layer's reading order does not always reconstruct the
  # analyte TABLE — on real report PDFs it yielded only header fields, so the
  # summary saw zero lab values and the "not a lab report" guardrail then fired
  # on a perfectly valid report. The L4 has ample OCR headroom, so the flagship
  # rasterises every page and runs RapidOCR (the image path that reliably
  # extracts the table), trading the shortcut for accuracy. The result cache
  # still makes re-runs instant.
  use_text_layer: false

# --- Maternal & Child Health (mothers) mode -------------------------------------
# Repoints the deterministic interpret + intake stages from generic lab reports to
# ANTENATAL maternal risk. Values come from the ANC card / lab report exactly as
# before (OCR -> faithfulness-gated summary), but interpretation uses maternal
# thresholds and produces a RISK TIER, and the intake asks antenatal danger-sign
# questions. Lab mode is unchanged on other profiles.
interpret:
  mode: maternal
  reference_path: data/mch/maternal_thresholds.yaml
  # A raised BP / severe anaemia / GDM-range sugar are the priority flags.
  high_priority_statuses: [critical]

intake_qa:
  bank_path: data/question_bank/maternal_patterns.yaml
  # The danger-sign screen (5) is always asked in full and is NOT counted here.
  # max_grounded caps the report-specific follow-ups (anaemia, high BP,
  # proteinuria, low platelets, high sugar) that ride on top, so different
  # reports ask different questions. max_questions bounds the general (non-
  # antenatal) bank only; kept for completeness.
  max_questions: 6
  # Up to this many report-specific follow-ups (specific patterns first, then the
  # generic catch-all for any other flagged value). 4 lets a multi-finding report
  # (e.g. pre-eclampsia: high BP + proteinuria + low platelets + anaemia) surface
  # all its key findings without over-questioning a routine visit.
  max_grounded: 4

